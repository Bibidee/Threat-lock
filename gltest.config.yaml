# GenLayer test/deploy configuration.
#
# Direct Mode (our fast unit tests) does NOT need this file — it runs the
# contract in-memory. This config is for Studio/StudioNet mode, where contracts
# are deployed over RPC and validated by real consensus.
#
# Docs: https://docs.genlayer.com/api-references/genlayer-test

networks:
  default: studionet

  # StudioNet — remote, no Docker. Accounts are auto-generated by the tooling,
  # but for real deploys we fund our own operator key (see .env).
  studionet:
    url: "https://studio.genlayer.com/api"
    leader_only: false

  # Local Studio (requires Docker) — we are intentionally NOT using this.
  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false

paths:
  contracts: "contracts"
  artifacts: "artifacts"

environment: .env
